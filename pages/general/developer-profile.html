  <style>
    body {
      background-color: var(--color-primary);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(200, 168, 78, 0.1) 0%, transparent 20%),
        radial-gradient(circle at 90% 80%, rgba(250, 250, 248, 0.05) 0%, transparent 20%);
      color: var(--color-text-inverse);
    }

    .developer-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: calc(100vh - 70px);
      padding: 20px;
    }

    .developer-card {
      background-color: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-lg);
      padding: 40px;
      max-width: 500px;
      width: 100%;
      text-align: center;
      box-shadow: var(--shadow-lg);
    }

    .developer-avatar {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: 3px solid var(--color-accent);
      object-fit: cover;
      margin: 0 auto 24px;
      display: block;
      box-shadow: 0 0 20px rgba(200, 168, 78, 0.2);
    }

    .developer-name {
      color: var(--color-text-inverse);
      margin-bottom: 8px;
    }

    .developer-role {
      margin-bottom: 24px;
    }

    .developer-education {
      background: rgba(0, 0, 0, 0.2);
      border-left: 3px solid var(--color-accent);
      padding: 20px;
      border-radius: var(--radius-md);
      margin-bottom: 24px;
      text-align: left;
    }

    .edu-title {
      font-size: 0.875rem;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .edu-text {
      font-size: 1rem;
      line-height: 1.5;
      color: var(--color-text-inverse);
    }

    .developer-tech {
      display: flex;
      justify-content: center;
      gap: 16px;
      font-size: 24px;
      margin-bottom: 32px;
      color: rgba(255, 255, 255, 0.6);
    }

    .developer-tech i:hover {
      color: var(--color-accent);
      transform: translateY(-2px);
      transition: all 0.3s ease;
    }

    .developer-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .btn--full {
      grid-column: span 2;
    }

    /* Dark mode overrides for outline button */
    .developer-actions .btn--outline {
      border-color: rgba(255, 255, 255, 0.2);
      color: var(--color-text-inverse);
    }
    
    .developer-actions .btn--outline:hover {
      background-color: rgba(255, 255, 255, 0.1);
      border-color: var(--color-text-inverse);
    }

    @media (max-width: 480px) {
      .developer-card {
        padding: 30px 20px;
      }
      .developer-actions {
        grid-template-columns: 1fr;
      }
      .btn--full {
        grid-column: span 1;
      }
    }
  </style>
